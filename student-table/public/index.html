<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Tables</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>📘 Student Information</h1>

    <div class="container">

        <!-- Table 1 -->
        <div class="table-box">
            <h2>Student Result</h2>

            <table>
                <tr>
                    <th>Student Name</th>
                    <th>Result</th>
                </tr>

                <tr>
                    <td>Rahul</td>
                    <td class="pass">Pass</td>
                </tr>

                <tr>
                    <td>Priya</td>
                    <td class="fail">Fail</td>
                </tr>

                <tr>
                    <td>Aman</td>
                    <td class="pass">Pass</td>
                </tr>

                <tr>
                    <td>Sneha</td>
                    <td class="pass">Pass</td>
                </tr>
            </table>
        </div>

        <!-- Table 2 -->
        <div class="table-box">
            <h2>Student CGPA</h2>

            <table>
                <tr>
                    <th>Student Name</th>
                    <th>CGPA</th>
                </tr>

                <tr>
                    <td>Rahul</td>
                    <td>8.5</td>
                </tr>

                <tr>
                    <td>Priya</td>
                    <td>6.2</td>
                </tr>

                <tr>
                    <td>Aman</td>
                    <td>9.1</td>
                </tr>

                <tr>
                    <td>Sneha</td>
                    <td>8.8</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
