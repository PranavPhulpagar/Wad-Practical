<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Department Grid</title>

    <!-- jQuery Mobile CSS -->
    <link rel="stylesheet"
    href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div data-role="page">

        <div data-role="header">
            <h1>Engineering Departments</h1>
        </div>

        <div role="main" class="ui-content">

            <div class="grid-container">

                <!-- IT -->
                <div class="dept-box">
                    <h2>IT</h2>

                    <a href="it.html"
                       class="ui-btn ui-btn-b">
                       Button
                    </a>
                </div>

                <!-- COMP -->
                <div class="dept-box">
                    <h2>COMP</h2>

                    <a href="comp.html"
                       class="ui-btn ui-btn-b">
                       Button
                    </a>
                </div>

                <!-- ETC -->
                <div class="dept-box">
                    <h2>ETC</h2>

                    <a href="etc.html"
                       class="ui-btn ui-btn-b">
                       Button
                    </a>
                </div>

                <!-- MECH -->
                <div class="dept-box">
                    <h2>MECH</h2>

                    <a href="mech.html"
                       class="ui-btn ui-btn-b">
                       Button
                    </a>
                </div>

                <!-- ELECT -->
                <div class="dept-box">
                    <h2>ELECT</h2>

                    <a href="elect.html"
                       class="ui-btn ui-btn-b">
                       Button
                    </a>
                </div>

            </div>

        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

    <!-- jQuery Mobile JS -->
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
