<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="text-align:center; margin-top:20px;">
        📋 Registered Users List
    </h1>

    <table>

        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>DOB</th>
                <th>Gender</th>
                <th>Mobile</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

    <script>

        let users = JSON.parse(localStorage.getItem("users")) || [];

        let tableBody = document.getElementById("tableBody");

        users.forEach(user => {

            let row = `
                <tr>
                    <td>${user.firstName}</td>
                    <td>${user.lastName}</td>
                    <td>${user.dob}</td>
                    <td>${user.gender}</td>
                    <td>${user.mobile}</td>
                    <td>${user.email}</td>
                </tr>
            `;

            tableBody.innerHTML += row;
        });
        

    </script>
    <button type="submit" onclick="window.location.href='index.html'">Go Back</button>

</body>
</html>
