<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real Estate Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                🏠 Dream Home Real Estate
            </span>
        </div>
    </nav>

    <!-- Heading -->
    <div class="container text-center mt-4">

        <h1 class="main-heading">
            Find Your Dream Property
        </h1>

        <p class="sub-text">
            Best Properties Available at Affordable Prices
        </p>

    </div>

    <!-- Property Cards -->
    <div class="container mt-5">

        <div class="row g-4">

            <!-- Property 1 -->
            <div class="col-md-4">

                <div class="card property-card">

                    <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994?q=80&w=1200&auto=format&fit=crop"
                         class="card-img-top"
                         alt="House">

                    <div class="card-body">

                        <h4>Luxury Villa</h4>

                        <p>
                            📍 Pune, Maharashtra
                        </p>

                        <h5 class="price">
                            ₹1.2 Crore
                        </h5>

                        <button class="btn btn-primary w-100 contact-btn">
                            Contact Us
                        </button>

                    </div>

                </div>

            </div>

            <!-- Property 2 -->
            <div class="col-md-4">

                <div class="card property-card">

                    <img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be?q=80&w=1200&auto=format&fit=crop"
                         class="card-img-top"
                         alt="Apartment">

                    <div class="card-body">

                        <h4>Modern Apartment</h4>

                        <p>
                            📍 Mumbai, Maharashtra
                        </p>

                        <h5 class="price">
                            ₹85 Lakh
                        </h5>

                        <button class="btn btn-primary w-100 contact-btn">
                            Contact Us
                        </button>

                    </div>

                </div>

            </div>

            <!-- Property 3 -->
            <div class="col-md-4">

                <div class="card property-card">

                    <img src="https://images.unsplash.com/photo-1600585154526-990dced4db0d?q=80&w=1200&auto=format&fit=crop"
                         class="card-img-top"
                         alt="Bungalow">

                    <div class="card-body">

                        <h4>Premium Bungalow</h4>

                        <p>
                            📍 Bangalore, Karnataka
                        </p>

                        <h5 class="price">
                            ₹2 Crore
                        </h5>

                        <button class="btn btn-primary w-100 contact-btn">
                            Contact Us
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
